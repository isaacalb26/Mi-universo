<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mi Universo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
    }
    body {
      background-color: #010003;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #modal-inicio {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(12, 3, 20, 0.92);
      border: 1px solid rgba(255, 105, 180, 0.5);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 40px rgba(236, 72, 153, 0.6);
      backdrop-filter: blur(12px);
      z-index: 10;
      width: 90%;
      max-width: 380px;
    }

    #modal-inicio h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #ffb7c5;
    }

    #corazon-icon {
      font-size: 45px;
      color: #ff3366;
      margin-bottom: 15px;
      animation: beat 1.2s infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    button {
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      border: none;
      padding: 12px 26px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.6);
    }

    #loader {
      display: none;
      margin-top: 15px;
    }

    #progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }

    #progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff007f, #7f00ff);
      transition: width 0.1s linear;
    }

    #titulo-galaxia {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }

    #titulo-galaxia h2 {
      font-size: 1.8rem;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #ff69b4, 0 0 25px #ff007f;
    }

    #titulo-galaxia p {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #ddd;
      margin-top: 4px;
    }

    canvas {
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="modal-inicio">
    <div id="corazon-icon">❤️</div>
    <h1 id="texto-bienvenida">Feliz Día de la Novia, Mi Amor</h1>
    <button id="btn-iniciar" onclick="iniciarCarga()">CLICK AQUÍ MI AMOR</button>
    
    <div id="loader">
      <p id="status-text"
